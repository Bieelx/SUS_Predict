<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #F6F5F2; color: #1A1814; margin: 0; padding: 0; }
    .container { max-width: 600px; margin: 40px auto; background-color: #FFFFFF; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.07), 0 4px 16px rgba(0,0,0,.05); border: 1px solid #E5E1D6; }
    .header { background-color: #FFFFFF; padding: 40px 40px 20px; text-align: center; }
    .header h1 { color: #1A1814; margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
    .content { padding: 20px 40px 40px; text-align: center; }
    .content p { font-size: 16px; line-height: 1.6; color: #3D3A33; margin-top: 0; margin-bottom: 24px; }
    .button { display: inline-block; background-color: #336FA1; color: #FFFFFF; font-weight: 600; font-size: 16px; text-decoration: none; padding: 14px 28px; border-radius: 8px; transition: background-color 0.2s; margin-bottom: 24px; }
    .button:hover { background-color: #2A5980; }
    .token-box { background-color: #F6F5F2; border: 1px dashed #C9C4BA; padding: 16px; border-radius: 8px; font-size: 24px; font-family: 'JetBrains Mono', monospace; font-weight: 700; letter-spacing: 4px; color: #1A1814; display: inline-block; margin-bottom: 24px;}
    .footer { background-color: #F0EDE6; padding: 32px 40px; text-align: center; border-top: 1px solid #E5E1D6; }
    .footer p { font-size: 13px; color: #6B665D; margin: 0; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Seu código de acesso</h1>
    </div>
    <div class="content">
      <p>Digite este código na tela de login do SusPredict para concluir o acesso:</p>
      <div class="token-box">{{ .Token }}</div>
    </div>
    <div class="footer">
      <p>O código vale por pouco tempo e só pode ser usado uma vez. Nunca compartilhe este código com ninguém. Se você não tentou entrar, ignore este e-mail e troque a sua senha.</p>
    </div>
  </div>
</body>
</html>
