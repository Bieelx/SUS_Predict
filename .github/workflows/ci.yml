name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements_api.txt
      # Prophet não é usado na predição (Holt → OLS); fica fora como no deploy.
      - run: sed '/^[[:space:]]*prophet/Id' api/requirements_api.txt > /tmp/requirements-ci.txt
      - run: pip install -r /tmp/requirements-ci.txt
      - run: python -m pytest api/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
